name: Local project validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Generate patched official source
        run: uv run --no-project python tools/prepare_mujoco_warp.py
      - name: Install locked dependencies and hooks
        run: |
          uv sync --locked --extra dev
          uv run pre-commit install
      - name: Check source
        run: uv run pre-commit run --all-files
      - name: Test generation and CPU-compatible PiPER behavior
        env:
          MUJOCO_GL: egl
        run: >-
          uv run pytest -n 8 tests contrib/piper_h/benchmark_checks_test.py
          contrib/piper_h/grasp_viewer_test.py
          contrib/piper_h/gripper_reference_test.py
      - name: GPU acceptance required locally
        run: echo 'Full uv run pytest -n 8 and GPU replay acceptance must also pass on a CUDA host.'
