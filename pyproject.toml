[project]
name = "piper-mujoco-lab"
version = "0.1.0"
description = "PiPER experiments with a patched official MuJoCo Warp engine"
requires-python = ">=3.10"
dependencies = ["mujoco-warp"]

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "pytest-xdist", "ruff", "pygls>=1.0.0,<2.0.0",
       "lsprotocol>=2023.0.1,<2024.0.0", "mjviser>=0.0.13", "pillow"]
cpu = ["jax"]
cuda = ["jax[cuda12]"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org/"
explicit = true

[tool.uv.sources]
mujoco-warp = {path = ".build/mujoco_warp", editable = true}
warp-lang = {index = "nvidia"}
mujoco = {index = "mujoco"}

[tool.ruff]
line-length = 128
indent-width = 2
extend-exclude = ["*.ipynb", "external", ".build", "contrib/piper_h/results"]

[tool.ruff.lint]
select = [
    "D",  # pydocstyle conventions and style
    "I",  # isort
    "W",  # pycodestyle
    "F401",  # unused imports
]

ignore = [
    "D100",  # missing docstring public module
    "D103",  # missing docstring public function
]

[tool.ruff.lint.isort]
known-first-party = ["mujoco_warp"]
force-single-line = true
single-line-exclusions = ["typing"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
max-line-length = 128

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D"]
"contrib/*" = ["D"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.pytest.ini_options]
testpaths = [".build/mujoco_warp/mujoco_warp", "contrib/piper_h", "tests"]
norecursedirs = ["external", "benchmarks", "results"]
